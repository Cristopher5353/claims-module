name: Build and deploy JAR app to Azure Web App - reclamaciones-app

on:
  push:
    branches:
      - main            # o master, según tu rama
    paths:
      - 'reclamos-backend/**'
      - '.github/workflows/master_reclamaciones-app.yml'   # nombre real de tu archivo
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'

      - name: Build with Maven
        run: mvn clean package -DskipTests
        working-directory: reclamos-backend

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: '${{ github.workspace }}/reclamos-backend/target/*.jar'

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_342C4F0DFF9C4F87BAE9345FE977F6CA }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_EC20BAEBC7F94B1CB1B93B0FFD19A40C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_EF58897C20B648949E2EC6717FF7C545 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'reclamaciones-app'
          slot-name: 'Production'
          package: '*.jar'
