# Puerto del servidor Backend
server.port=8080

# Configuración de conexión a MySQL (Ajustado a tu nueva BD)

#Esta conexion es para la base de datos con datos llenos para pruebas, ejecutar el bdreclamos.sql
spring.datasource.url=${URL_DATABASE}

#Esta conexion es para la base de datos con datos vacios empezando desde 0, ejecutar reclamos_tottus.SQL(sacar el comentario de la linea de abajo 
#y comentar la linea de arriba) 
# spring.datasource.url=jdbc:mysql://localhost:3306/reclamos_tottus?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
#usuario y pass de la conexion de mysql, si no funciona, cambiar a tu usuario y pass de mysql
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Aumentar límite de subida de archivos a 10MB (RNF08)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# Muestra los parámetros reales que se envían en el WHERE de la consulta
logging.level.org.hibernate.orm.results=warn
logging.level.org.hibernate.resource.transaction=warn

# Adicionalmente, para ver los JSON que entran a los controladores
logging.level.org.springframework.web=warn


# ==========================================
# CONFIGURACIÓN DE CORREO (GMAIL)
# ==========================================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
# Aquí NO va tu contraseña normal, va la "Contraseña de Aplicación" de 16 letras
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Crucial SMTP and Security properties

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

spring.config.import=optional:file:.env[.properties]